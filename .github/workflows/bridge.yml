name: Bridge

on:
  pull_request:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge.yml"
  push:
    tags:
      - "bridge-v*"

defaults:
  run:
    working-directory: bridge

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo fmt --check
      - run: cargo clippy --features production --all-targets -- -D warnings
      - run: cargo test --features production

  release:
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - name: Install Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo build --release --features production
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/openportal-bridge.exe "dist/openportal-bridge-${{ matrix.target }}.exe"
          else
            cp target/release/openportal-bridge "dist/openportal-bridge-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openportal-bridge-${{ matrix.target }}
          path: bridge/dist/*
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bridge/dist/*
