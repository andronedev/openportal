name: Provisioning drift

# Alerts when Immortal's upstream provisioning kit moves away from the vendored
# snapshot that catalog/apps/immortal-launcher/openportal.js was ported against. A
# change to provision.sh (the procedure) fails the job so the program gets
# re-reviewed; a change to config.env alone (data) just prints a notice, since
# the runtime reads release-tag values live.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Immortal provisioning drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-provision-drift.mjs
